[project]
name = "thessmap"
version = "0.1.0"
description = "Interactive atlas of Thessaloniki urban infrastructure"
requires-python = ">=3.12"

# The package's own dependencies, so `pip install -e .` produces a
# working environment on its own. environment.yml pins the same set
# through conda-forge, where the GDAL/GEOS/PROJ binaries come prebuilt.
dependencies = [
    "geopandas>=1.0",
    "shapely>=2.0",
    "pyproj>=3.6",
    "pyogrio>=0.9",
    "pandas>=2.2",
    "numpy>=1.26",
    "scipy>=1.11",
    "mapclassify>=2.6",
    "networkx>=3.0",
    "rasterio>=1.3",
    "pillow>=10.0",
    "folium>=0.17",
    "branca>=0.7",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]
notebook = ["jupyterlab>=4.2", "ipykernel>=6.29"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
